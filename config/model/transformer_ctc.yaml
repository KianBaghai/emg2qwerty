# @package _global_
module:
  _target_: emg2qwerty.lightning.TransformerCTCModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384]
  d_model: 256
  nhead: 8
  num_encoder_layers: 4
  dim_feedforward: 1024
  dropout: 0.25  # stronger regularization to reduce overfitting (val vs test CER gap)
  max_len: 5000
# Optional: use optimizer=adamw_wd for weight decay (e.g. python -m emg2qwerty.train model=transformer_ctc optimizer=adamw_wd)

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context
