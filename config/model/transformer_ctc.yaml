# @package _global_
module:
  _target_: emg2qwerty.lightning.TransformerCTCModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384]
  d_model: 256
  nhead: 8
  num_encoder_layers: 4
  dim_feedforward: 1024
  dropout: 0.2   # balance: reduce overfitting (test CER) without hurting val CER
  max_len: 5000
# For lower CER: try optimizer=adamw_wd and/or decoder=ctc_beam at test time

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context
